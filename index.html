<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#5b3f91" />
  <meta name="description" content="李晨鸣与高雅婷的婚礼邀请函｜2026年11月20日" />
  <title>李晨鸣 & 高雅婷｜婚礼邀请函</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b3f91'/%3E%3Cpath d='M17 34c-8-9 5-20 15-7 10-13 23-2 15 7-5 6-10 10-15 15-5-5-10-9-15-15Z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    :root {
      --violet: #60438f;
      --violet-deep: #3b285f;
      --violet-soft: #8267aa;
      --white: #fffdf9;
      --line: rgba(255, 253, 249, .84);
      --muted: rgba(255, 253, 249, .68);
      --shadow: rgba(31, 18, 53, .34);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--white);
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.14) 0 1px, transparent 2px),
        radial-gradient(circle at 81% 72%, rgba(255,255,255,.09) 0 1px, transparent 2px),
        linear-gradient(145deg, #765aa2 0%, var(--violet) 45%, #493071 100%);
      background-size: 34px 34px, 47px 47px, auto;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .invitation {
      position: relative;
      width: min(100%, 580px);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 32%, rgba(26,14,48,.12)),
        transparent;
      box-shadow: 0 0 70px rgba(31, 17, 52, .2);
    }

    .invitation::before,
    .invitation::after {
      content: "";
      position: absolute;
      inset: 14px;
      z-index: 12;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 44% 44% 18px 18px / 8% 8% 18px 18px;
      pointer-events: none;
    }
    .invitation::after { inset: 20px; border-color: rgba(255,255,255,.09); }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 20;
      opacity: .08;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .sparkles { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .sparkles i {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      animation: twinkle 3.2s ease-in-out infinite;
    }
    .sparkles i:nth-child(1){left:11%;top:16%}.sparkles i:nth-child(2){left:78%;top:12%;animation-delay:.8s}
    .sparkles i:nth-child(3){left:91%;top:41%;animation-delay:1.5s}.sparkles i:nth-child(4){left:16%;top:63%;animation-delay:2.1s}
    .sparkles i:nth-child(5){left:72%;top:79%;animation-delay:.35s}.sparkles i:nth-child(6){left:35%;top:8%;animation-delay:1.2s}
    @keyframes twinkle { 0%,100%{opacity:.28;transform:scale(.75)} 50%{opacity:1;transform:scale(1.7)} }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(32px, env(safe-area-inset-top)) 30px max(30px, env(safe-area-inset-bottom));
      transition: opacity .8s ease, visibility .8s;
    }
    .scene[aria-hidden="true"] { opacity: 0; visibility: hidden; pointer-events: none; }

    .intro { z-index: 2; }
    .intro-mark {
      position: absolute;
      top: max(42px, calc(env(safe-area-inset-top) + 20px));
      left: 0; right: 0;
      text-align: center;
      letter-spacing: .28em;
      font-size: .72rem;
      color: rgba(255,255,255,.7);
      opacity: 0;
      animation: fadeIn 1.2s .5s forwards;
    }
    .intro-mark strong {
      display: block;
      margin-top: 9px;
      font-family: Didot, "Times New Roman", serif;
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 400;
      letter-spacing: .18em;
      color: var(--white);
    }

    .cat-flight {
      position: absolute;
      left: 50%;
      bottom: -68%;
      width: min(78vw, 390px);
      transform: translateX(-50%);
      filter: drop-shadow(0 12px 22px rgba(40,25,68,.18));
      animation: rise 6.2s cubic-bezier(.24,.75,.26,1) .35s forwards;
    }
    @keyframes rise {
      0% { bottom: -68%; transform: translateX(-50%) rotate(-3deg); }
      62% { bottom: 10%; transform: translateX(-50%) rotate(2deg); }
      100% { bottom: 108%; transform: translateX(-50%) rotate(-2deg); }
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .envelope-wrap {
      width: min(76vw, 335px);
      text-align: center;
      opacity: 0;
      transform: translateY(46px) scale(.86);
      animation: envelopeArrive 1.1s cubic-bezier(.18,.8,.2,1) 4.9s forwards;
    }
    @keyframes envelopeArrive { to { opacity:1; transform:translateY(0) scale(1); } }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.56;
      padding: 0;
      color: var(--white);
      background: rgba(255,255,255,.035);
      border: 1.5px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 20px 50px var(--shadow), inset 0 0 36px rgba(255,255,255,.03);
      -webkit-tap-highlight-color: transparent;
      transition: transform .35s ease, background .35s ease;
    }
    .envelope:hover, .envelope:focus-visible { transform: translateY(-4px); background: rgba(255,255,255,.08); }
    .envelope:focus-visible { outline: 2px solid #fff; outline-offset: 7px; }
    .envelope svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.2; fill: none; }
    .envelope .seal {
      position: absolute;
      left: 50%; top: 54%;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      transform: translate(-50%,-50%);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 50%;
      background: var(--violet);
      font-family: Didot, serif;
      font-size: .77rem;
      letter-spacing: .08em;
      box-shadow: 0 4px 14px rgba(34,18,58,.28);
    }
    .envelope-wrap p { margin: 18px 0 0; font-size: .78rem; letter-spacing: .32em; color: var(--muted); }
    .envelope-wrap.opened { animation: none; opacity: 1; transform: translateY(-30vh) scale(.6); transition: 1.3s ease; }
    .envelope-wrap.opened .envelope { transform: rotateX(22deg); opacity: .32; }

    .poem-stage { z-index: 4; text-align: center; }
    .poem {
      width: min(87vw, 440px);
      display: grid;
      gap: clamp(9px, 1.8vh, 17px);
      place-items: center;
      margin-top: -5vh;
    }
    .poem-line {
      display: block;
      opacity: 0;
      filter: blur(7px);
      transform: translate(var(--x), var(--y)) rotate(var(--r));
      color: rgba(255,255,255,.96);
      font-size: clamp(.96rem, 3.8vw, 1.22rem);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: .13em;
      text-shadow: 0 3px 14px rgba(30,15,51,.22);
    }
    .poem-stage.assemble .poem-line {
      animation: assemble 1.55s cubic-bezier(.17,.76,.23,1) var(--d) forwards;
    }
    @keyframes assemble { to {opacity:1;filter:blur(0);transform:translate(0,0) rotate(0)} }
    .guide-cta {
      position: absolute;
      left: 50%; bottom: max(58px, calc(env(safe-area-inset-bottom) + 38px));
      transform: translate(-50%, 16px);
      min-width: 176px;
      padding: 13px 24px 12px;
      color: var(--white);
      background: transparent;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      letter-spacing: .28em;
      font-size: .86rem;
      box-shadow: 0 12px 34px rgba(35,18,60,.2);
      transition: .35s ease;
    }
    .poem-stage.ready .guide-cta { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
    .guide-cta:hover, .guide-cta:focus-visible { color:var(--violet-deep); background:#fff; outline:none; }

    .guide { z-index: 6; align-content: center; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .guide-head { text-align: center; padding-top: 5px; }
    .eyebrow { margin: 0 0 4px; font-family: Didot, serif; font-style: italic; font-size: .72rem; letter-spacing: .28em; color: var(--muted); }
    .names { margin: 0; font-family: Didot, "Times New Roman", serif; font-size: clamp(1.55rem, 7vw, 2.35rem); font-weight: 400; letter-spacing: .08em; }
    .date { margin: 5px 0 0; font-size: .78rem; letter-spacing: .28em; color: rgba(255,255,255,.8); }

    .photo-shell {
      position: relative;
      width: min(78vw, 360px);
      height: min(45vh, 480px);
      min-height: 280px;
      margin: 0 auto;
      padding: 11px;
      border: 1px solid rgba(255,255,255,.83);
      border-radius: 46% 46% 8px 8px / 18% 18% 8px 8px;
      box-shadow: 0 16px 48px rgba(29,15,49,.28);
    }
    .photo-shell::before {
      content:""; position:absolute; inset:5px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:inherit; pointer-events:none;
    }
    .photos { position:relative; width:100%; height:100%; overflow:hidden; border-radius:42% 42% 3px 3px / 16% 16% 3px 3px; background:#4a3373; }
    .photos img {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      opacity:0; transform:scale(1.05); transition:opacity 1.15s ease, transform 5.6s ease;
    }
    .photos img.active { opacity:1; transform:scale(1); }
    .photo-count { position:absolute; right:17px; bottom:16px; z-index:3; padding:5px 9px; border-radius:999px; background:rgba(54,36,82,.45); backdrop-filter:blur(8px); font-family:Didot,serif; font-size:.65rem; letter-spacing:.12em; }

    .details { width:min(88vw, 460px); margin:0 auto; }
    .timeline { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:0; padding:0; list-style:none; }
    .timeline li { position:relative; text-align:center; padding-top:12px; }
    .timeline li::before { content:""; position:absolute; top:2px; left:50%; width:5px; height:5px; border:1px solid white; border-radius:50%; transform:translateX(-50%); background:var(--violet); }
    .timeline li:not(:last-child)::after { content:""; position:absolute; top:5px; left:calc(50% + 5px); width:calc(100% - 10px); height:1px; background:rgba(255,255,255,.34); }
    .timeline time { display:block; font-family:Didot,serif; font-size:.88rem; letter-spacing:.04em; }
    .timeline span { display:block; margin-top:4px; font-size:.64rem; letter-spacing:.06em; color:rgba(255,255,255,.72); white-space:nowrap; }
    .address { margin:10px 0 0; text-align:center; font-size:.75rem; letter-spacing:.12em; color:rgba(255,255,255,.82); }
    .address small { display:block; margin-bottom:2px; font-family:Didot,serif; font-style:italic; letter-spacing:.2em; color:rgba(255,255,255,.55); }

    .restart {
      position:absolute; top:max(27px, calc(env(safe-area-inset-top) + 14px)); right:28px; z-index:15;
      width:34px; height:34px; display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.28); border-radius:50%; color:rgba(255,255,255,.8); background:rgba(60,40,92,.15); cursor:pointer;
      opacity:0; pointer-events:none; transition:.3s ease;
    }
    .restart.show { opacity:1; pointer-events:auto; }
    .restart svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; }

    @media (max-height: 690px) {
      .guide { gap:7px; }
      .photo-shell { height:40vh; min-height:235px; }
      .names { font-size:1.45rem; }
      .timeline span { font-size:.58rem; }
      .address { margin-top:5px; }
      .poem { gap:7px; }
      .poem-line { font-size:.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
      .cat-flight { display:none; }
    }
  </style>
</head>
<body>
  <main class="invitation" aria-label="李晨鸣与高雅婷的婚礼邀请函">
    <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <section class="scene intro" id="intro" aria-hidden="false">
      <div class="intro-mark">YOU ARE INVITED<strong>Li &amp; Gao</strong></div>
      <img class="cat-flight" src="assets/cat-balloons.png" alt="小猫拉着气球缓缓升起" />
      <div class="envelope-wrap" id="envelopeWrap">
        <button class="envelope" id="openEnvelope" type="button" aria-label="打开婚礼邀请信">
          <svg viewBox="0 0 320 205" aria-hidden="true">
            <path d="M2 3h316v199H2z" />
            <path d="m3 5 157 116L317 5M3 202l108-96M317 202l-108-96" />
          </svg>
          <span class="seal">L·G</span>
        </button>
        <p>轻触开启邀请</p>
      </div>
    </section>

    <section class="scene poem-stage" id="poemStage" aria-hidden="true">
      <div class="poem" aria-label="邀请序言">
        <span class="poem-line" style="--x:-38vw;--y:-21vh;--r:-8deg;--d:.1s">我们带着各自的认知地图</span>
        <span class="poem-line" style="--x:42vw;--y:-14vh;--r:7deg;--d:.42s">试图抵达彼此心灵的彼岸</span>
        <span class="poem-line" style="--x:-46vw;--y:4vh;--r:10deg;--d:.75s">越过高山　森林</span>
        <span class="poem-line" style="--x:37vw;--y:10vh;--r:-6deg;--d:1.05s">听见虫鸣　鸟叫</span>
        <span class="poem-line" style="--x:-35vw;--y:22vh;--r:5deg;--d:1.35s">和彼此心跳的声音</span>
        <span class="poem-line" style="--x:22vw;--y:28vh;--r:-9deg;--d:1.65s">山川远阔</span>
        <span class="poem-line" style="--x:-12vw;--y:38vh;--r:4deg;--d:1.95s">世界就在你我眼前</span>
      </div>
      <button class="guide-cta" id="openGuide" type="button">婚礼指南　→</button>
    </section>

    <section class="scene guide" id="guide" aria-hidden="true">
      <header class="guide-head">
        <p class="eyebrow">Our Wedding Day</p>
        <h1 class="names">李晨鸣 <span>&amp;</span> 高雅婷</h1>
        <p class="date">2026 · 11 · 20</p>
      </header>

      <div class="photo-shell" aria-label="新人照片轮播">
        <div class="photos" id="photos">
          <img class="active" src="assets/01.webp" alt="新人婚纱照 1" />
          <img src="assets/02.webp" alt="新人婚纱照 2" />
          <img src="assets/03.webp" alt="新人婚纱照 3" />
          <img src="assets/04.webp" alt="新人婚纱照 4" />
          <img src="assets/05.webp" alt="新人婚纱照 5" />
          <img src="assets/06.webp" alt="新人婚纱照 6" />
          <img src="assets/07.webp" alt="新人婚纱照 7" />
        </div>
        <span class="photo-count" id="photoCount">01 / 07</span>
      </div>

      <footer class="details">
        <ol class="timeline" aria-label="婚礼流程">
          <li><time>14:18</time><span>迎宾签到</span></li>
          <li><time>15:38</time><span>婚礼仪式</span></li>
          <li><time>18:08</time><span>婚礼晚宴</span></li>
          <li><time>19:38</time><span>Afterparty</span></li>
        </ol>
        <p class="address"><small>Location</small>台州市椒江区 · 在方舟</p>
      </footer>
    </section>

    <button class="restart" id="restart" type="button" aria-label="重新播放邀请函">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 1 0 1 6M20 3v5h-5" /></svg>
    </button>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const poemStage = document.getElementById('poemStage');
    const guide = document.getElementById('guide');
    const envelopeWrap = document.getElementById('envelopeWrap');
    const openEnvelope = document.getElementById('openEnvelope');
    const openGuide = document.getElementById('openGuide');
    const restart = document.getElementById('restart');
    const slides = [...document.querySelectorAll('#photos img')];
    const photoCount = document.getElementById('photoCount');
    let slideIndex = 0;
    let slideshow;

    function showScene(next) {
      [intro, poemStage, guide].forEach(section => {
        const active = section === next;
        section.setAttribute('aria-hidden', String(!active));
      });
    }

    function enterPoem() {
      envelopeWrap.classList.add('opened');
      setTimeout(() => {
        showScene(poemStage);
        requestAnimationFrame(() => poemStage.classList.add('assemble'));
        setTimeout(() => poemStage.classList.add('ready'), 4300);
      }, 700);
    }

    function startSlideshow() {
      clearInterval(slideshow);
      slideshow = setInterval(() => {
        slides[slideIndex].classList.remove('active');
        slideIndex = (slideIndex + 1) % slides.length;
        slides[slideIndex].classList.add('active');
        photoCount.textContent = String(slideIndex + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
      }, 4100);
    }

    function enterGuide() {
      showScene(guide);
      restart.classList.add('show');
      startSlideshow();
    }

    function replay() {
      clearInterval(slideshow);
      slides.forEach((slide, index) => slide.classList.toggle('active', index === 0));
      slideIndex = 0;
      photoCount.textContent = '01 / 07';
      restart.classList.remove('show');
      poemStage.classList.remove('assemble', 'ready');
      envelopeWrap.classList.remove('opened');
      showScene(intro);
      void envelopeWrap.offsetWidth;
      envelopeWrap.style.animation = 'none';
      void envelopeWrap.offsetWidth;
      envelopeWrap.style.animation = '';
    }

    openEnvelope.addEventListener('click', enterPoem, { once: true });
    openGuide.addEventListener('click', enterGuide);
    restart.addEventListener('click', () => window.location.reload());

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && intro.getAttribute('aria-hidden') === 'false') enterPoem();
    });
  </script>
</body>
</html>
